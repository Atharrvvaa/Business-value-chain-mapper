version: "3.9"

services:
  backend:
    build: ./backend
    container_name: capmap-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: capmap-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

